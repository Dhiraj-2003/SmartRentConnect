spring.application.name=SmartRentConnect

# ================= MYSQL DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/smartrentconnect_db
spring.datasource.username=root
spring.datasource.password=vishnu@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Note: Role is now an enum, no separate roles table needed


# ================= JWT CONFIG =================
# JWT secret key
jwt.secret=SmartRentConnectSuperSecretKeyForJWTGeneration12345!

# JWT expiration time in ms (1 day)
jwt.expirationMs=86400000

# ================= FILE UPLOAD CONFIG =================
# File upload directory
app.file.upload-dir=uploads

# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Static resource handling
spring.web.resources.static-locations=file:uploads/
